# Purpose: Run the canonical repository proof on every supported CI operating system.
# Used by: GitHub Actions for main-branch pushes and pull requests.
# Inputs: The checked-out source plus Python 3.12 and pytest.
# Outputs: Independent Windows, Ubuntu, and macOS verification results.
# Side effects: Installs test tooling only inside disposable hosted runners.
# Safety: CI validates portability but does not publish, release, or access user data.
# Failure behavior: Any verifier or pytest failure blocks the workflow matrix job.
# Related proof: scripts/verify_project.py and tests/test_verify_project.py.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python scripts/verify_project.py
      - run: python -m pytest -q
