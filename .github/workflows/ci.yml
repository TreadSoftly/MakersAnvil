# Purpose: Run the canonical repository proof on every supported CI operating system.
# Used by: GitHub Actions for main-branch pushes and pull requests.
# Inputs: The checkout, Python 3.12, tests, and pinned Windows package tools.
# Outputs: Cross-platform verification plus a smoke-tested Windows executable artifact.
# Side effects: Installs tooling and uploads an ephemeral artifact on hosted runners.
# Safety: CI has read-only source access and never publishes a release, signs code, or accesses user data.
# Failure behavior: Any verifier, pytest, package, or smoke failure blocks its job.
# Related proof: scripts/verify_project.py and tests/test_verify_project.py.
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run test --prefix frontend
      - run: python -m pip install --upgrade pip pytest
      - run: python scripts/verify_project.py
      - run: python scripts/check_clean_machine.py
      - run: python -m pytest -q

  package-windows:
    name: Build Windows executable
    runs-on: windows-latest
    steps:
      # Packaging is isolated from the cross-platform verifier so Linux/macOS
      # evidence never pretends that one operating system built another's app.
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: python -m pip install --upgrade pip pywebview==6.2.1 pyinstaller==6.21.0
      - run: python scripts/build_windows_exe.py
      - run: .\artifacts\windows\MakersAnvil.exe --smoke
      - uses: actions/upload-artifact@v6
        with:
          name: MakersAnvil-windows-x64-pass-022
          path: artifacts/windows/MakersAnvil.exe
          if-no-files-found: error
