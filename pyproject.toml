[project]
name = "makers-anvil"
version = "0.1.0"
description = "Local-first control panel for DIY maker workflows."
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
desktop = ["pywebview==6.2.1"]
package = ["pyinstaller==6.21.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend/src"]
addopts = "-q"
