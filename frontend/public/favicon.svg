      <stop offset="1" stop-color="#222b33"/>
    </linearGradient>
    <linearGradient id="face" x1="118" y1="214" x2="356" y2="318" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbfff8"/>
      <stop offset="0.42" stop-color="#c7d2dd"/>
      <stop offset="1" stop-color="#748390"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
