<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Makers Anvil</title>
  <desc id="desc">Dark app icon with an anvil and green cyan sparks.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="28" x2="456" y2="492" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f171d"/>
      <stop offset="0.58" stop-color="#071014"/>
      <stop offset="1" stop-color="#030506"/>
    </linearGradient>
    <linearGradient id="anvil" x1="112" y1="178" x2="398" y2="390" gradientUnits="userSpaceOnUse">
